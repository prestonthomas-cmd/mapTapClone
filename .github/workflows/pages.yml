name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` block on purpose. Naming the github-pages environment
    # here puts the job behind that environment's deployment-branch policy,
    # which GitHub pins to whichever branch was default when Pages was first
    # enabled — and it does not follow later changes to the default branch.
    # The deploy itself still targets github-pages; only the job-level gate
    # is skipped.
    steps:
      - uses: actions/checkout@v4

      # The game is already static, so there is nothing to build - but Pages
      # must be turned on for the repository before the artifact can upload.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
